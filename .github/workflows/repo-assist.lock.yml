h(github.event.discussion.body, '/repo-assist\n') || startsWith(github.event.discussion.body, '/repo-assist\r') || github.event.discussion.body == '/repo-assist') || github.event_name == 'discussion_comment' && (startsWith(github.event.comment.body, '/repo-assist ') || startsWith(github.event.comment.body, '/repo-assist\n') || startsWith(github.event.comment.body, '/repo-assist\r') || github.event.comment.body == '/repo-assist')) || !(github.event_name == 'issues' || github.event_name == 'issue_comment' || github.event_name == 'pull_request' || github.event_name == 'pull_request_review_comment' || github.event_name == 'discussion' || github.event_name == 'discussion_comment'))"
    runs-on: ubuntu-slim
